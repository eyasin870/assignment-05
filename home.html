<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub</title>
    <!-- tailwind+daisyui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />




    <!-- google font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- fav icon -->
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>
    <!-- css -->
    <link rel="" href="style.css">
</head>

<body class="bg-gray-50">
    <header>
        <nav class="flex justify-between items-center px-3 py-4 bg-white shadow-xl">
            <!-- left -->
            <div class="left flex-1 flex gap-2 items-center">
                <div class="w-14">
                    <img src="./assets/github-logo.png" alt="">
                </div>
                <h2 class="text-2xl font-semibold text-[#1F2937]">GitHub Issues Tracker</h2>

            </div>
            <!-- right -->
            <div class="right flex-1 flex gap-2 justify-end ">
                <label class="input text-gray-500">
                    <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                            stroke="currentColor">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.3-4.3"></path>
                        </g>
                    </svg>
                    <input id="search-input" type="search" required placeholder="Search issues..." />
                </label>
                <div class="">
                    <button class="btn btn-primary px-5 font-semibold py-3"><i class="fa-solid fa-plus"></i>New
                        Issue</button>
                </div>

            </div>
        </nav>
    </header>
    <hr class="border-3 border-gray-400 mb-10">
    <main class="w-10/12 mx-auto mt-10">
        <section class="btn-section  px-4 py-6 shadow-xl bg-white">
            <button id="tab-all" onclick="switchTab('all')"
                class="btn border-2 px-10 py-2 text-white border-blue btn-primary">All</button>
            <button id="tab-open" onclick="switchTab('open')"
                class="btn border-2 px-10 py-2 text-gray-500  border-gray-200">Open</button>
            <button id="tab-closed" onclick="switchTab('closed')"
                class="btn border-2 px-10 py-2 text-gray-500  border-gray-200">Closed</button>


        </section>
        <section id="section-card-details" class="flex justify-between bg-white p-4 my-10">
            <div class="left flex gap-4 items-center ">
                <div class="p-2 bg-gray-400 rounded-full">
                    <img src="./assets/Aperture.png" alt="">
                </div>
                <div>
                    <h2 class="text-2xl font-semibold"><span id="issue-count">0</span> Issues</h2>
                    <p class="text-gray-500">Track and manage your project issues</p>
                </div>
            </div>
            <div class="right flex gap-4">
                <div id="open-box" class="flex gap-1 items-center justify-center">
                    <div class="w-2 rounded-full bg-green-900 p-2"></div>
                    <p> Open</p>
                </div>
                <div id="close-box" class="flex gap-1 items-center justify-center">
                    <div class="w-2 rounded-full bg-red-900 p-2"></div>
                    <p>Closed</p>
                </div>
            </div>

        </section>
        <section id="all-section-card-container">
            <section id="all-container" class="grid grid-cols-3 gap-4">



            </section>
            <!-- Open the modal using ID.showModal() method -->
            <!-- <button class="btn" onclick="my_modal_1.showModal()">open modal</button> -->
            <dialog id="my_modal_1" class="modal">
                <div class="modal-box p-4 space-y-3.5">
                    <h2 id="modalTitle" class="font-bold text-2xl text-[#1F2937] text-[14px]">Fix broken image uploads</h2>
                    <div class="flex gap-3 items-center">
                        <p id="status" class="bg-green-400 px-3 py-2 font-medium rounded-full text-[13px]">Open</p>
                        <p class="text-gray-500 text-[12px]">Opened by Fahim Ahmed</p>
                        <p class="text-gray-500 text-[12px]">22/02/2026</p>

                    </div>
                    <div>
                        <button class="bg-yellow-300 px-3 py-1 btn rounded-2xl">Bug</button>
                        <button  class="bg-yellow-300 px-3 py-1 btn rounded-2xl">HELP WANTED</button>

                    </div>
                    <p id="description" class="text-[14px]">The navigation menu doesn't collapse properly on mobile devices. Need to fix the
                        responsive behavior.</p>
                    <div class="flex gap-10">
                        <div class="">
                            <p class="text-[12px] text-gray-500">Assignee:</p>
                            <h2 id="assignee" class="font-medium text-[16px]">Fahim Ahmed</h2>
                        </div>
                        <div>
                            <p class="text-[12px] text-gray-500">Priority:</p>
                            <p id="priority" class="font-medium text-[16px] bg-red-300 px-3 py-1 rounded-2xl">HIGH</p>
                        </div>
                    </div>
                    <div class="modal-action">
                        <form method="dialog">
                            <!-- if there is a button in form, it will close the modal -->
                            <button class="btn btn-primary">Close</button>
                        </form>
                    </div>

                </div>
            </dialog>

        </section>


    </main>
    <script src="./js/home.js"></script>




</body>

</html>
